name: Build & Publish Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Determine Version
        id: version_info
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.version_tag || 'v1.0.0' }}"
          # Clean tag: remove leading 'v' or 'V' for versionName
          VERSION_NAME=$(echo "$RAW_TAG" | sed -e 's/^[vV]//')
          echo "tag_name=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building for Tag: $RAW_TAG, VersionName: $VERSION_NAME"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Secret KEYSTORE_BASE64 is missing! Configure signing secrets in GitHub repository settings."
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.version_info.outputs.version_name }}" \
            --no-daemon

      - name: Clean up Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Prepare APK artifact
        id: prepare_apk
        run: |
          APK_NAME="HondaEScanner.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.prepare_apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Workflow Artifact (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_name }}
