changelog:
  categories:
    - title: '🚀 New Features & Enhancements'
      labels:
        - 'feature'
        - 'enhancement'
    - title: '🐛 Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
    - title: '🔧 Other Changes'
      labels:
        - '*'
  exclude:
    labels:
      - 'ignore-for-release'
